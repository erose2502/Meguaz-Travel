<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <!-- Tint the browser's own chrome (status bar, tab strip) to the page
         ground so the app reads edge-to-edge instead of framed in white. -->
    <meta name="theme-color" content="#f5ead8" />
    <!-- Fonts load async (print→all swap): a slow fonts.googleapis.com must
         never block first paint — text renders in fallbacks, then swaps. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap"
      />
    </noscript>
    <!-- The hero's poster paints the first frame while videos defer. Low
         priority on purpose: it must never outrank the JS bundle or the boot
         scene photo on a slow connection. Phones preload the -m variant. -->
    <link rel="preload" as="image" href="/media/plan-fjords-m.jpg" fetchpriority="low" media="(max-width: 767px)" />
    <link rel="preload" as="image" href="/media/plan-fjords.jpg" fetchpriority="low" media="(min-width: 768px)" />
    <script>
      // Self-heal for stale shells: if the app bundle 404s or arrives as the
      // wrong type after a deploy rotated the hashes, pull a fresh shell once
      // instead of leaving a blank page.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target
          if (
            t &&
            t.tagName === 'SCRIPT' &&
            t.src &&
            t.src.indexOf('/assets/') !== -1 &&
            !sessionStorage.getItem('mg-reloaded')
          ) {
            sessionStorage.setItem('mg-reloaded', '1')
            location.reload()
          }
        },
        true
      )
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root">
      <style>
        /* Boot state: replaced the instant React mounts. Self-contained so it
           paints before any stylesheet or font arrives; the fade-in delay
           keeps fast loads from ever flashing it. A random destination scene
           + fun fact make the wait part of the product. */
        #mg-boot {
          position: fixed;
          inset: 0;
          background: #10201f;
          opacity: 0;
          animation: mg-boot-in 0.4s ease 0.15s forwards;
        }
        #mg-boot .bg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          opacity: 0;
          transition: opacity 0.7s ease;
        }
        #mg-boot .veil {
          position: absolute;
          inset: 0;
          background: linear-gradient(rgba(12, 20, 20, 0.62), rgba(12, 20, 20, 0.12) 34%, rgba(10, 16, 16, 0.15) 56%, rgba(8, 14, 14, 0.78));
        }
        #mg-boot .top {
          position: absolute;
          top: 26vh;
          left: 0;
          right: 0;
          text-align: center;
          color: #fff;
        }
        #mg-boot .word {
          font-family: Caprasimo, system-ui, sans-serif;
          font-size: 30px;
          letter-spacing: 0.01em;
          text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
        }
        #mg-boot .tag {
          margin-top: 6px;
          font: 600 10px/1 system-ui, sans-serif;
          letter-spacing: 0.32em;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.82);
        }
        #mg-boot .bottom {
          position: absolute;
          left: 18px;
          right: 18px;
          bottom: calc(24px + env(safe-area-inset-bottom, 0px));
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        #mg-boot .eyebrow {
          font: 600 10px/1 system-ui, sans-serif;
          letter-spacing: 0.3em;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.78);
        }
        #mg-boot .city {
          font-family: Caprasimo, system-ui, sans-serif;
          font-size: 42px;
          line-height: 1;
          color: #fff;
          margin: 2px 0 4px;
          text-shadow: 0 2px 22px rgba(0, 0, 0, 0.4);
        }
        #mg-boot .features {
          font: 12.5px/1.4 system-ui, sans-serif;
          color: rgba(255, 255, 255, 0.8);
        }
        #mg-boot .spin {
          position: absolute;
          left: calc(50% - 13px);
          top: 47vh;
          width: 26px;
          height: 26px;
          border-radius: 999px;
          border: 2.5px solid rgba(255, 255, 255, 0.28);
          border-top-color: #fff;
          animation: mg-boot-spin 0.9s linear infinite;
        }
        #mg-boot .fact {
          display: flex;
          align-items: flex-start;
          gap: 9px;
          max-width: 400px;
          padding: 11px 16px;
          border-radius: 14px;
          background: rgba(24, 20, 16, 0.5);
          -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: rgba(255, 255, 255, 0.94);
          font: 13.5px/1.5 system-ui, sans-serif;
          margin: 0;
        }
        #mg-boot .fact .spark {
          color: #f0b45c;
          flex: none;
          margin-top: 1px;
        }
        @keyframes mg-boot-in {
          to {
            opacity: 1;
          }
        }
        @keyframes mg-boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div id="mg-boot" role="status" aria-label="Loading Meguaz">
        <img class="bg" id="mg-boot-img" alt="" fetchpriority="high" />
        <div class="veil"></div>
        <div class="top">
          <div class="word">Meguaz</div>
          <div class="tag">Your journey, perfected</div>
        </div>
        <div class="spin"></div>
        <div class="bottom">
          <div>
            <div class="eyebrow">Now boarding</div>
            <div class="city" id="mg-boot-city"></div>
          </div>
          <p class="fact"><span class="spark">✦</span><span id="mg-boot-fact"></span></p>
          <div class="features">✈ Real fares · 🧭 Door-to-gate plans · 🧳 Honest bag fees</div>
        </div>
      </div>
      <script>
        ;(function () {
          var scenes = {
            CDG: 'Paris', NRT: 'Tokyo', LIS: 'Lisbon', ATH: 'Athens', DXB: 'Dubai', FCO: 'Rome',
            IST: 'Istanbul', SIN: 'Singapore', BKK: 'Bangkok', SYD: 'Sydney', CPH: 'Copenhagen', MEX: 'Mexico City',
          }
          var codes = Object.keys(scenes)
          var facts = [
            'The shortest scheduled flight on earth lasts 57 seconds, in Orkney, Scotland.',
            "Japan's rail network is so punctual that a 1-minute delay comes with an apology.",
            'Singapore Changi has a butterfly garden between gates.',
            'There are more than 40,000 airports on the planet — you have options.',
            'The Trans-Siberian railway crosses eight time zones on one ticket.',
            'Iceland has no mosquitoes. None. Bring everything else, skip the spray.',
            'In Lisbon, the ginjinha shot glass is sometimes made of chocolate. Eat the glass.',
            'Venice builds on wooden piles driven a thousand years ago — still holding.',
            "The world's deepest metro station is in Kyiv, 105 m under the city.",
          ]
          var code = codes[Math.floor(Math.random() * codes.length)]
          var img = document.getElementById('mg-boot-img')
          if (img) {
            img.onload = function () {
              img.style.opacity = '1'
            }
            // Phones get the ~70KB "-m" variant; the boot photo must win the
            // bandwidth race against the bundle, not fight it.
            img.src = '/media/scenes/' + code + (window.innerWidth < 768 ? '-1-m.jpg' : '-1.jpg')
          }
          var city = document.getElementById('mg-boot-city')
          if (city) city.textContent = scenes[code]
          var fact = document.getElementById('mg-boot-fact')
          if (fact) fact.textContent = facts[Math.floor(Math.random() * facts.length)]
        })()
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
