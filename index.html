<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <!-- Fonts load async (print→all swap): a slow fonts.googleapis.com must
         never block first paint — text renders in fallbacks, then swaps. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap"
      />
    </noscript>
    <!-- The hero's poster paints the first frame while videos defer. -->
    <link rel="preload" as="image" href="/media/plan-fjords.jpg" fetchpriority="high" />
    <script>
      // Self-heal for stale shells: if the app bundle 404s or arrives as the
      // wrong type after a deploy rotated the hashes, pull a fresh shell once
      // instead of leaving a blank page.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target
          if (
            t &&
            t.tagName === 'SCRIPT' &&
            t.src &&
            t.src.indexOf('/assets/') !== -1 &&
            !sessionStorage.getItem('mg-reloaded')
          ) {
            sessionStorage.setItem('mg-reloaded', '1')
            location.reload()
          }
        },
        true
      )
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root">
      <style>
        /* Boot state: replaced the instant React mounts. Self-contained so it
           paints before any stylesheet or font arrives; the fade-in delay
           keeps fast loads from ever flashing it. */
        #mg-boot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #f5eee1;
          opacity: 0;
          animation: mg-boot-in 0.5s ease 0.25s forwards;
        }
        #mg-boot .orb {
          width: 46px;
          height: 46px;
          border-radius: 999px;
          background: radial-gradient(circle at 32% 28%, #9fd0c6, #305f59 72%);
          box-shadow: 0 10px 26px -12px #305f59;
          animation: mg-boot-breathe 1.6s ease-in-out infinite;
        }
        #mg-boot .word {
          font-family: Caprasimo, system-ui, sans-serif;
          font-size: 30px;
          color: #2e2b25;
        }
        #mg-boot .hint {
          font: 13px/1.4 system-ui, sans-serif;
          color: #877f6f;
        }
        @keyframes mg-boot-in {
          to {
            opacity: 1;
          }
        }
        @keyframes mg-boot-breathe {
          0%,
          100% {
            transform: scale(1);
            opacity: 0.9;
          }
          50% {
            transform: scale(1.14);
            opacity: 1;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #mg-boot .orb {
            animation: none;
          }
        }
      </style>
      <div id="mg-boot" role="status" aria-label="Loading Meguaz">
        <div class="orb"></div>
        <div class="word">Meguaz</div>
        <div class="hint">Preparing your journeys…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
